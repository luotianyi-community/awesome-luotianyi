name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: test and verify
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: |
          if [ -d tests ] && [ -n "$(find tests -type f -name '*.test.*' -print -quit)" ]; then
            # 显式列出测试文件：不依赖各 Node 版本对 --test 目录/glob 参数的支持差异
            files=()
            while IFS= read -r f; do files+=("$f"); done < <(find tests -type f -name '*.test.*' | sort)
            node --test "${files[@]}"
          else
            echo "tests/ 下暂无测试文件，跳过"
          fi

      # README 必须与 data/entries/listed.json 的渲染结果一致
      - name: README is up to date
        run: |
          node scripts/render-readme.mjs --dry-run > "${RUNNER_TEMP}/render.json"
          cat "${RUNNER_TEMP}/render.json"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const bad=(d.results||[]).filter((r)=>r.changed);if(bad.length){console.error('README 未按数据渲染: '+bad.map((b)=>b.file).join(', '));process.exit(1)}" "${RUNNER_TEMP}/render.json"
          files=""
          if [ -f README.md ]; then files="README.md"; fi
          if [ -f README_EN.md ]; then files="${files} README_EN.md"; fi
          if [ -z "${files}" ]; then
            echo "README 尚无标记块模板，跳过 git diff 检查"
            exit 0
          fi
          git diff --exit-code -- ${files}

      - name: Validate
        run: node scripts/validate.mjs
