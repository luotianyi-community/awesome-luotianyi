name: catalog-sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "每个查询抓取的页数"
        required: false
        default: "2"
        type: string
      dry_run:
        description: "演练模式：只写盘不提交（false 时正常提交）"
        required: false
        default: false
        type: boolean
      since:
        description: "起始日期 YYYY-MM-DD（留空则沿用 state 中的水位线）"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"

permissions:
  contents: write

# Shared with every other workflow that pushes to main, so commits serialise.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  sync:
    name: scan catalog and sync readme
    runs-on: ubuntu-latest
    # 机器人自己的提交不再触发（配合 [skip ci] 双保险）
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 退出码 0=正常，1=失败，2=限流放弃（不算失败，下一轮按水位线续跑）
      - name: Scan catalog
        id: scan
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES: ${{ github.event.inputs.pages || '2' }}
          SINCE: ${{ github.event.inputs.since || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set +e
          args=("--root" "." "--pages" "${PAGES}")
          if [ -n "${SINCE}" ]; then args+=("--since" "${SINCE}"); fi
          if [ "${DRY_RUN}" = "true" ]; then args+=("--dry-run"); fi
          node scripts/scan-catalog.mjs "${args[@]}"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 0 ] || [ "${code}" -eq 2 ]; then
            if [ "${code}" -eq 2 ]; then
              echo "::warning::scan-catalog 因限流退出(2)：本轮不视为失败，水位线已落盘，下一轮续跑"
            fi
            exit 0
          fi
          echo "::error::scan-catalog 失败，退出码 ${code}"
          exit "${code}"

      - name: Report scan outcome
        if: always()
        run: |
          echo "### catalog-sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- scan-catalog outcome: ${{ steps.scan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- scan-catalog exit code: ${{ steps.scan.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

      # 限流(2) 已在上面按“不算失败”处理；这里只拦真实失败，避免静默吞掉
      - name: Fail on genuine scan error
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::scan-catalog 真实失败（exit ${{ steps.scan.outputs.exit_code }}），本轮中止，不提交任何改动"
          exit 1

      # 队列看板：把未自动建 Issue 的候选汇总到一个 Issue，便于集中查看
      - name: Refresh queue board
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/queue-board.mjs

      - name: Render README
        run: node scripts/render-readme.mjs

      - name: Unit tests
        run: |
          if [ -d tests ] && [ -n "$(find tests -type f -name '*.test.*' -print -quit)" ]; then
            # 显式列出测试文件：不依赖各 Node 版本对 --test 目录/glob 参数的支持差异
            files=()
            while IFS= read -r f; do files+=("$f"); done < <(find tests -type f -name '*.test.*' | sort)
            node --test "${files[@]}"
          else
            echo "tests/ 下暂无测试文件，跳过"
          fi

      # 校验必须在提交前，失败即整轮失败
      - name: Validate
        run: node scripts/validate.mjs

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry-run：跳过提交"
            exit 0
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有改动，跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data
          if [ -f README.md ]; then git add -- README.md; fi
          if [ -f README_EN.md ]; then git add -- README_EN.md; fi
          if git diff --cached --quiet; then
            echo "暂存区为空，跳过提交"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%d)"
          git commit -m "chore(catalog): auto sync ${STAMP} [skip ci]"
          # Another workflow may have committed between checkout and push; rebase and retry
          # rather than failing the whole decision. Data files are regenerated, so on a
          # conflict we keep this run's version and re-apply it on top.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, retrying (attempt ${attempt})"
            git fetch origin main
            git rebase --abort 2>/dev/null || true
            git -c rebase.autoStash=true pull --rebase --no-edit origin main || {
              git checkout --theirs -- data 2>/dev/null || true
              git add -A -- data
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            }
            sleep $((attempt * 5))
          done
          echo 'push failed after retries'
          exit 1
