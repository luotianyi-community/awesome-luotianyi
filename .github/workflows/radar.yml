name: radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "每个查询抓取的页数"
        required: false
        default: "1"
        type: string
      dry_run:
        description: "演练模式：不写盘、不开 Issue、不提交"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

# Shared with every other workflow that pushes to main, so commits serialise.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  radar:
    name: scan radar and open candidates
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 退出码 0=正常，1=失败，2=限流放弃（不算失败）
      # continue-on-error used to be set here so that a rate-limit exit (2) would not fail
      # the job. Side effect: a genuine failure also reported outcome=success, so the step
      # looked green and only the guard at the bottom went red. That is how four broken
      # radar runs read as "scan succeeded, commit skipped". The exit code is handled
      # explicitly below instead, so no step is masked.
      - name: Scan radar
        id: radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES: ${{ github.event.inputs.pages || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set +e
          args=("--root" "." "--pages" "${PAGES}")
          if [ "${DRY_RUN}" = "true" ]; then args+=("--dry-run"); fi
          node scripts/scan-radar.mjs "${args[@]}"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 0 ] || [ "${code}" -eq 2 ]; then
            if [ "${code}" -eq 2 ]; then
              echo "::warning::scan-radar 因限流退出(2)：本轮不视为失败，水位线已落盘，下一轮续跑"
            fi
            exit 0
          fi
          echo "::error::scan-radar 失败，退出码 ${code}"
          exit "${code}"

      - name: Open candidate issues
        id: issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set +e
          args=("--limit" "20")
          if [ "${DRY_RUN}" = "true" ]; then args+=("--dry-run"); fi
          node scripts/open-issues.mjs "${args[@]}"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 0 ] || [ "${code}" -eq 2 ]; then
            if [ "${code}" -eq 2 ]; then
              echo "::warning::open-issues 因限流退出(2)：本轮不视为失败，下一轮续跑"
            fi
            exit 0
          fi
          echo "::error::open-issues 失败，退出码 ${code}"
          exit "${code}"

      # 候选建完 Issue 后刷新看板，让剩下没达标的候选也可见
      # The board is a convenience view, not catalog data, so a failure here must not
      # abort the run -- but it must not vanish either. Without continue-on-error the
      # exit code is real, and the warning pins it to the summary.
      - name: Refresh queue board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node scripts/queue-board.mjs
          code=$?
          if [ "${code}" -ne 0 ]; then
            echo "::warning::看板刷新失败（exit ${code}）：队列本身已更新，只是这个 Issue 没刷新"
          fi
          exit 0

      - name: Report radar outcome
        if: always()
        run: |
          echo "### radar" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- scan-radar exit: ${{ steps.radar.outputs.exit_code }} (0=ok, 2=rate limited, other=failed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- open-issues exit: ${{ steps.issues.outputs.exit_code }} (0=ok, 2=rate limited, other=failed)" >> "$GITHUB_STEP_SUMMARY"

      # 限流(2) 已在上面的 run 块里转成 warning + exit 0；真实失败会让对应步骤直接变红，
      # 不再需要这里兜底。保留这条会在失败时多打一遍重复的 error。
      # 摘要里仍会记录两个 exit_code，便于排查。

      # radar 只碰 data/state 与候选队列；README 由 catalog-sync 统一渲染，
      # 这里刻意不跑 render / validate，避免两个工作流同时改 README 撞车。
      - name: Commit state changes
        if: github.event.inputs.dry_run != 'true'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry-run：跳过提交"
            exit 0
          fi
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "data/ 无改动，跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data
          if git diff --cached --quiet; then
            echo "暂存区为空，跳过提交"
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%d)"
          git commit -m "chore(radar): update state ${STAMP} [skip ci]"
          # Another workflow may have committed between checkout and push; rebase and retry
          # rather than failing the whole decision. Data files are regenerated, so on a
          # conflict we keep this run's version and re-apply it on top.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, retrying (attempt ${attempt})"
            git fetch origin main
            git rebase --abort 2>/dev/null || true
            git -c rebase.autoStash=true pull --rebase --no-edit origin main || {
              git checkout --theirs -- data 2>/dev/null || true
              git add -A -- data
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            }
            sleep $((attempt * 5))
          done
          echo 'push failed after retries'
          exit 1
