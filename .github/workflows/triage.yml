name: triage

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Every workflow that commits to main shares one group. Keying by issue number let
# ten simultaneous decisions race on the same push; only one of them survived.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  triage:
    name: apply decision command
    runs-on: ubuntu-latest
    # Both candidate issues and the queue board accept decisions. The board has no repo in
    # its title, so its commands carry one explicitly: "/approve owner/repo category".
    if: "contains(github.event.issue.title, '[candidate]') || contains(github.event.issue.title, '[queue]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Triage issue comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/triage-issue.mjs

      - name: Detect data changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data/ 有改动，需要渲染与校验"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/ 无改动，跳过渲染与提交"
          fi

      - name: Render README
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/render-readme.mjs

      - name: Validate
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/validate.mjs

      # 裁决后刷新看板：已处理的候选必须立刻从名单里消失
      # 看板刷新失败不该让一次已经成功的裁决标红：裁决本身已落库，只是这个视图没更新。
      - name: Refresh queue board
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node scripts/queue-board.mjs
          code=$?
          if [ "${code}" -ne 0 ]; then
            echo "::warning::看板刷新失败（exit ${code}）：裁决已生效，只是看板没刷新"
          fi
          exit 0

      - name: Commit decision
        if: steps.changes.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data
          if [ -f README.md ]; then git add -- README.md; fi
          if [ -f README_EN.md ]; then git add -- README_EN.md; fi
          if git diff --cached --quiet; then
            echo "暂存区为空，跳过提交"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git commit -q -m "chore(triage): apply decision for #${ISSUE_NUMBER} [skip ci]" || true
            if git push; then exit 0; fi

            # Another writer reached main first. Merging the two JSON files by hand would
            # resurrect stale rows: an approve that dropped a queue entry can be undone by
            # an older snapshot winning a conflict. So throw this attempt away, take the
            # new origin/main as the baseline, and re-apply the very same decision on top
            # of it. The decision is a pure function of (issue, comment, registry), so
            # replaying it is both safe and idempotent.
            echo "push rejected, reapplying the decision on top of origin/main (attempt ${attempt})"
            git fetch origin main
            git reset --hard origin/main
            TRIAGE_REPLAY=1 ISSUE_NUMBER="${ISSUE_NUMBER}" node scripts/triage-issue.mjs || {
              echo "重放失败，保留上次提交"
              exit 1
            }
            node scripts/render-readme.mjs
            node scripts/validate.mjs
            git add -A -- data
            if [ -f README.md ]; then git add -- README.md; fi
            if [ -f README_EN.md ]; then git add -- README_EN.md; fi
            if git diff --cached --quiet; then
              echo "重放后无改动，其他运行已包含本次裁决"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'push failed after retries'
          exit 1
